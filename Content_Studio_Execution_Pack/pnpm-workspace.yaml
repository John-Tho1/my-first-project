packages:
  - apps/*
  - packages/*

# pnpm 11+ 는 설정을 이 파일에서 읽는다(.npmrc 의 engine-strict 와 동일 의도).
engineStrict: true

# 의존성 설치 스크립트는 실행하지 않는다. esbuild·unrs-resolver 는 플랫폼별 optional 패키지로 바이너리를 받으므로
# postinstall 없이 동작한다(T01 에서 tsx·drizzle-kit·vitest·eslint 실행으로 확인).
allowBuilds:
  esbuild: false
  unrs-resolver: false

# LIVE-L1(D34): @anthropic-ai/sdk 0.128.0 의 전이 의존성(json-schema-to-ts → @babel/runtime ^7)이 3일 된 7.29.10 으로 풀려
# 공급망 규칙(공개 후 2주 이상)에 맞게 2026-05-25 공개판으로 고정한다.
overrides:
  '@babel/runtime': 7.29.7
